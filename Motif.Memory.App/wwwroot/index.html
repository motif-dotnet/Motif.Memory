<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app has its own dark theme, so browsers mustn't darken it themselves (Chrome on Android's "dark theme for sites"). -->
    <meta name="color-scheme" content="light dark" />
    <title>Motif Memory</title>
    <meta name="description" content="Set up an agent's external memory: a git repo of Markdown files, with the roles, workflow and design guidelines that suit you." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Motif.NET" />
    <meta property="og:title" content="Motif Memory" />
    <meta property="og:description" content="Set up an agent's external memory: a git repo of Markdown files the agent reads a level at a time, with the roles, workflow and design guidelines you choose. Runs in the browser, with no server and no accounts." />
    <meta property="og:url" content="https://motif-dotnet.github.io/Motif.Memory/" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preload" href="fonts/IBMPlexSans-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/IBMPlexSans-SemiBold-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/motif.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // Apply a remembered theme before the first paint, so dark-mode users don't see a flash.
        try {
            const t = localStorage.getItem("motif-theme");
            if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch { }
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="splash">
            <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.9" y="15.74" width="5.36" height="5.36" rx="0.96" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8.42" y="8.42" width="7.16" height="7.16" rx="1.86" fill="currentColor"/><rect x="14.84" y="2" width="7.16" height="7.16" rx="1.86" fill="var(--accent)"/></svg>
            <div class="word"><span class="motif">Motif</span> <b>Memory</b></div>
            <div class="loading">Loading…</div>
            <noscript>Motif Memory needs JavaScript and WebAssembly.</noscript>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Nothing has been written outside a folder you picked, so it's safe to reload, though your choices will be lost.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <!-- Counts visits for Motif.NET: see the motif-dotnet.github.io README. -->
    <script data-goatcounter="https://motif-dotnet.goatcounter.com/count" async src="https://gc.zgo.at/count.v4.js" crossorigin="anonymous" integrity="sha384-nRw6qfbWyJha9LhsOtSb2YJDyZdKvvCFh0fJYlkquSFjUxp9FVNugbfy8q1jdxI+"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
