# Keeps this app's copy of the Motif web kit (motif-dotnet/.github brand/web) up to date.
# Every day, and when run by hand, it syncs the kit, runs the tests, and if they pass commits any
# change straight to main and deploys. If they fail, the run goes red and nothing is committed.
# On pushes and pull requests it only checks, and goes red when the copy has drifted. It never blocks a deploy.
name: Motif web kit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the kit is up to date
        run: bash scripts/sync-suite.sh --check

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync the kit
        id: sync
        run: |
          bash scripts/sync-suite.sh
          if [ -n "$(git status --porcelain)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "Already up to date."; fi

      - uses: actions/setup-dotnet@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Test
        if: steps.sync.outputs.changed == 'true'
        run: dotnet test Motif.Memory.sln -c Release

      - name: Commit to main
        if: steps.sync.outputs.changed == 'true'
        run: |
          kit=$(git ls-remote https://github.com/motif-dotnet/.github.git refs/heads/main | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync the Motif web kit" -m "From motif-dotnet/.github $kit, by the daily kit sync. Tests passed before it was committed."
          git push origin HEAD:main
      # A push made with the workflow's own token doesn't start other workflows, so start the deploy by hand.
      - name: Deploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
